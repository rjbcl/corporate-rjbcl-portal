<div class="header">
    <div class="header-content">
        <nav class="navbar navbar-expand">
            <div class="collapse navbar-collapse justify-content-between">
                <div class="header-left">
                    <div class="search_bar dropdown">
                        <span class="search_icon p-3 c-pointer" data-toggle="dropdown">
                            <i class="bi bi-search"></i>
                        </span>
                        <div class="dropdown-menu p-0 m-0">
                            <form>
                                <input class="form-control" type="search" placeholder="Search policies..."
                                    aria-label="Search">
                            </form>
                        </div>
                    </div>
                </div>

                <ul class="navbar-nav header-right">
                    <li class="nav-item dropdown header-profile">
                        <a class="nav-link" href="#" role="button" data-toggle="dropdown">
                            <i class="bi bi-building"></i>
                            <span class="ml-2">{{ company.company_name }}</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-right">
                            <button type="button" class="btn dropdown-item" data-toggle="modal"
                                data-target="#exampleModalCenter">
                                <i class="bi bi-key"></i>
                                <span class="ml-2">Change Password</span>
                            </button>
                            <form action="{% url 'logout' %}" method="post">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item text-dark">
                                    <i class="bi bi-box-arrow-right"></i>
                                    <span class="ml-2">Logout</span>
                                </button>
                            </form>

                        </div>
                    </li>
                </ul>
            </div>
        </nav>
    </div>
</div>

<div class="modal fade" id="exampleModalCenter" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Change Password</h5>
                <button type="button" class="close" data-dismiss="modal"><span>×</span></button>
            </div>
            <div class="modal-body pb-0">
                <!-- Alert box for feedback -->
                <div id="passwordAlert" class="alert d-none" role="alert"></div>

                <form id="changePasswordForm">
                    {% csrf_token %}
                    <div class="form-row">
                        <div class="form-group col-md-12">
                            <label>Current Password</label>
                            <input type="password" name="current_password" id="currentPassword" class="form-control" required>
                        </div>
                        <div class="form-group col-md-12">
                            <label>New Password</label>
                            <input type="password" name="new_password" id="newPassword" class="form-control" required>
                        </div>
                        <div class="form-group col-md-12">
                            <label>Confirm New Password</label>
                            <input type="password" name="confirm_password" id="confirmPassword" class="form-control" required>
                        </div>
                    </div>
                    <div class="modal-footer p-1">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="submit" id="submitBtn" class="btn btn-primary">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
