{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Select Company - Dashboard</title>

    <!-- Favicon icon -->
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'images/favicon-logo.png' %}">
    
    <!-- Same CSS as base.html to maintain Focus theme styling -->
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap-icons.min.css' %}">
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <link href="{% static 'css/stylenew.css' %}" rel="stylesheet">
    
    <style>
        /* Mimicking the Focus template's centered auth/page layout */
        body {
            background-color: #f3f4f6; /* Focus default light grey bg */
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .select-card {
            max-width: 450px;
            width: 100%;
            border: 0;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); /* Focus default card shadow */
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 0.15rem rgba(79, 70, 229, 0.1);
        }
    </style>
</head>

<body>
    <div class="card select-card">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <img src="{% static 'images/rjbclogo.png' %}" alt="Logo" style="max-width: 180px; margin-bottom: 1.5rem;">
                <h3 class="font-weight-bold mb-2">Select a Company</h3>
                <p class="text-muted">Please select a company to access its dashboard.</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} mb-3">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="form-group mb-4">
                    <label for="company_id" class="form-label text-uppercase small font-weight-bold text-muted">Available Companies</label>
                    <select name="company_id" id="company_id" class="form-control form-control-lg" required>
                        <option value="" disabled selected>-- Select a Company --</option>
                        {% for company in companies %}
                            <option value="{{ company.company_id }}">{{ company.company_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block font-weight-bold">
                    Open Dashboard
                </button>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS for any component interactions -->
    <script src="{% static 'vendor/global/global.min.js' %}"></script>
    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>

</html>
